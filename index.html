<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXO · Prototipo low-fi navegable</title>
<style>
:root{--bg:#e9ecef;--sc:#fff;--ink:#212529;--mut:#6c757d;--line:#adb5bd;--fill:#f1f3f5;--ink2:#343a40;--ok:#2b8a3e;--err:#c92a2a;--warn:#e67700;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--sc:#212529;--ink:#f1f3f5;--mut:#adb5bd;--line:#5c636a;--fill:#2b3035;--ink2:#dee2e6;--ok:#69db7c;--err:#ff8787;--warn:#ffa94d;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
.phone{width:100%;max-width:390px;min-height:640px;background:var(--sc);border:2px solid var(--ink2);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
header.top{padding:12px 16px;border-bottom:2px solid var(--ink2);display:flex;align-items:center;gap:10px;font-weight:700}
header.top .logo{border:2px solid var(--ink2);padding:0 8px;border-radius:4px}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}
input[type=search]{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:var(--sc);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--sc);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--ink2);background:var(--ink2);color:var(--sc);font-weight:700}
.card{border:2px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sc)}
.meta{color:var(--mut);font-size:14px}
.badge{align-self:flex-start;border:2px solid currentColor;border-radius:4px;padding:2px 8px;font-size:14px;font-weight:700}
.b-ok{color:var(--ok)}.b-low{color:var(--warn)}.b-no{color:var(--err)}
.btn{font:inherit;font-weight:700;padding:12px 16px;border-radius:6px;border:2px solid var(--ink2);background:var(--ink2);color:var(--sc);cursor:pointer;width:100%}
.btn.sec{background:var(--sc);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.link{background:none;border:0;color:var(--ink);font:inherit;text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}
.img{height:120px;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;font-size:15px}.row b{min-width:64px}
.plazas{border:2px solid currentColor;border-radius:8px;padding:10px 12px;font-weight:700}
ul{margin:0;padding-left:20px}
.cta{position:sticky;bottom:0;padding:12px 16px;background:var(--sc);border-top:2px solid var(--ink2);display:flex;flex-direction:column;gap:8px}
.center{text-align:center;align-items:center}
.spin{width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--ink2);border-radius:50%;animation:s 1s linear infinite;margin:24px auto 8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.icon{font-size:44px;font-weight:700}
.panel{width:100%;max-width:390px;margin-top:12px;font-size:13px;color:var(--mut);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
.panel label{display:flex;gap:8px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <header class="top"><span class="logo">NEXO</span><span id="hdr">Actividades</span></header>
  <div id="view" style="display:flex;flex-direction:column;flex:1"></div>
  <div id="live" aria-live="polite" style="position:absolute;left:-9999px"></div>
</div>
<div class="panel">
  <b>Panel del prototipo</b> (no forma parte de la interfaz) · Tarea de prueba: «Encuentra una actividad disponible esta semana e inicia la inscripción».
  <label><input type="checkbox" id="simErr"> Simular error al inscribirse</label>
  <button class="link" id="reset" style="font-size:13px;color:var(--mut)">Reiniciar prototipo</button>
</div>
<script>
const base=[
{id:1,t:"Taller de fotografía",d:"Sáb 31 oct · 11:00",l:"Centro Joven",p:4,tot:15,pr:0,c:["Edad: 14–30 años","Traer cámara o móvil","Cancelación gratuita hasta 24 h antes"]},
{id:2,t:"Ruta en bici",d:"Dom 1 nov · 10:00",l:"Punto de encuentro: Plaza Mayor",p:0,tot:20,pr:0,c:["Edad: a partir de 16 años","Casco obligatorio","Se cancela si llueve"]},
{id:3,t:"Torneo de ajedrez",d:"Vie 30 oct · 17:30",l:"Biblioteca municipal",p:12,tot:24,pr:0,c:["Todas las edades","Se juega con reloj","Inscripción individual"]},
];
let acts,st;
function init(){acts=JSON.parse(JSON.stringify(base));acts.forEach(a=>a.me=false);st={v:"list",id:null,q:"",f:{sem:true,pl:false,gr:false}};draw()}
const $=s=>document.querySelector(s),v=()=>$("#view"),cur=()=>acts.find(a=>a.id===st.id);
const week=a=>true;
function pl(a){if(a.me)return`<div class="plazas b-ok">✓ Estás inscrito/a en esta actividad</div>`;
if(a.p===0)return`<div class="plazas b-no">Completa · sin plazas</div>`;
return`<div class="plazas ${a.p<=4?"b-low":"b-ok"}">Quedan ${a.p} plazas de ${a.tot}</div>`}
function badge(a){return a.me?`<span class="badge b-ok">Inscrito/a</span>`:a.p===0?`<span class="badge b-no">Completa</span>`:`<span class="badge ${a.p<=4?"b-low":"b-ok"}">Quedan ${a.p} plazas</span>`}
function say(t){$("#live").textContent=t}
function draw(){
const a=cur(),h=$("#hdr");
if(st.v==="list"){h.textContent="Actividades";
const L=acts.filter(x=>(!st.f.sem||week(x))&&(!st.f.pl||x.p>0)&&(!st.f.gr||x.pr===0)&&x.t.toLowerCase().includes(st.q.toLowerCase()));
v().innerHTML=`<main><h1>Encuentra tu actividad</h1>
<input type="search" id="q" placeholder="Buscar actividad" aria-label="Buscar actividad" value="${st.q}">
<div class="chips" role="group" aria-label="Filtros">
<button class="chip" data-f="sem" aria-pressed="${st.f.sem}">Esta semana</button>
<button class="chip" data-f="pl" aria-pressed="${st.f.pl}">Con plazas</button>
<button class="chip" data-f="gr" aria-pressed="${st.f.gr}">Gratis</button></div>
<div class="meta">${L.length} actividades</div>
${L.map(x=>`<article class="card"><h2>${x.t}</h2><div class="meta">${x.d} · ${x.l}</div>${badge(x)}<button class="btn sec" data-go="det" data-id="${x.id}">Ver actividad</button></article>`).join("")||`<div class="card">No hay actividades con estos filtros. <button class="link" data-clear>Quitar filtros</button></div>`}</main>`;
const q=$("#q");q.oninput=e=>{st.q=e.target.value;const p=e.target.selectionStart;draw();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
if(st.v==="det"){h.textContent="Detalle";
v().innerHTML=`<main><button class="link" data-go="list">‹ Volver a actividades</button><div class="img">Imagen de la actividad</div><h1>${a.t}</h1>
<div class="row"><b>Fecha</b><span>${a.d}</span></div><div class="row"><b>Lugar</b><span>${a.l}</span></div><div class="row"><b>Precio</b><span>${a.pr?a.pr+" €":"Gratis"}</span></div>
${pl(a)}<h2>Condiciones</h2><ul>${a.c.map(c=>`<li>${c}</li>`).join("")}</ul></main>
<div class="cta"><button class="btn" data-go="proc" ${a.p===0||a.me?"disabled":""}>${a.me?"Ya estás inscrito/a":a.p===0?"Sin plazas disponibles":"Inscribirme"}</button></div>`}
if(st.v==="proc"){h.textContent="Inscripción";say("Procesando tu inscripción");
v().innerHTML=`<main class="center"><div class="spin" role="status"></div><h1>Procesando tu inscripción…</h1><p class="meta">${a.t} · ${a.d}<br>No cierres esta pantalla.</p></main><div class="cta"><button class="btn" disabled>Procesando…</button></div>`;
setTimeout(()=>{if(st.v!=="proc")return;if($("#simErr").checked){st.v="err"}else{a.p--;a.me=true;st.v="ok"}draw()},1400)}
if(st.v==="ok"){h.textContent="Inscripción";say("Inscripción confirmada");
v().innerHTML=`<main class="center"><div class="icon b-ok" aria-hidden="true">✓</div><h1>Inscripción confirmada</h1>
<div class="card" style="width:100%;text-align:left"><h2>${a.t}</h2><div class="meta">${a.d}<br>${a.l}</div><div class="meta">Plazas restantes: ${a.p}</div></div>
<p class="meta">Tu plaza queda reservada. Puedes consultar las condiciones en el detalle.</p></main>
<div class="cta"><button class="btn" data-go="list">Volver a actividades</button><button class="btn sec" data-go="det">Ver actividad</button></div>`}
if(st.v==="err"){h.textContent="Inscripción";say("No se ha podido completar la inscripción");
v().innerHTML=`<main class="center"><div class="icon b-no" aria-hidden="true">!</div><h1>No se ha podido completar la inscripción</h1>
<p class="meta">No se ha reservado ninguna plaza. Comprueba tu conexión e inténtalo de nuevo.</p></main>
<div class="cta"><button class="btn" data-go="proc">Reintentar</button><button class="btn sec" data-go="det">Volver al detalle</button></div>`}
window.scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
if(t.id==="reset"){init();return}
if(t.dataset.f){st.f[t.dataset.f]=!st.f[t.dataset.f];draw();return}
if(t.hasAttribute("data-clear")){st.f={sem:false,pl:false,gr:false};st.q="";draw();return}
if(t.dataset.go){if(t.dataset.id)st.id=+t.dataset.id;st.v=t.dataset.go;draw()}});
init();
</script>
</body>
</html>
